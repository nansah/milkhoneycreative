<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Call | Milk &amp; Honey Creative Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        .schedule-banner { background: var(--cream); padding: 5rem 2rem 3rem; text-align: center; border-bottom: 1px solid var(--border); }
        .schedule-banner .section-label { justify-content: center; }
        .schedule-banner h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin: 1rem 0 1rem; }
        .schedule-banner p { max-width: 560px; margin: 0 auto; color: var(--text-muted); font-size: 1.05rem; }
        .schedule-body { width: 100%; padding: 0; }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="mhc-header" id="site-header">
        <div class="mhc-header-inner">
            <a href="/" class="mhc-logo-link">
                <img src="/mhc-logo.svg" alt="Milk & Honey Creative Studio" class="mhc-logo">
            </a>
            <button class="mhc-hamburger" id="menu-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <nav class="mhc-nav" id="main-nav">
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/work.html">Work</a>
                <a href="/services.html">Services</a>
                <a href="/contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- PAGE BANNER -->
    <section class="schedule-banner">
        <span class="section-label">Let's Connect</span>
        <h1>Schedule a Call</h1>
        <p>Book a free 30-minute discovery call. We'll talk through your project, your goals, and how I can help.</p>
    </section>

    <!-- CALENDLY EMBED -->
    <div class="schedule-body">
        <!-- Calendly inline widget begin -->
        <div class="calendly-inline-widget" data-url="https://calendly.com/milkhoneycreativestudio/30min" style="min-width:320px;height:700px;width:100%;"></div>
        <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
        <!-- Calendly inline widget end -->
    </div>

    <!-- FOOTER -->
    <footer class="mhc-footer">
        <div class="mhc-footer-inner">
            <div class="mhc-footer-logo">
                <img src="/mhc-logo.svg" alt="Milk & Honey Creative Studio">
            </div>
            <nav class="mhc-footer-nav">
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/work.html">Work</a>
                <a href="/services.html">Services</a>
                <a href="/contact.html">Contact</a>
            </nav>
            <div class="mhc-footer-copy">&copy; 2025 Milk &amp; Honey Creative Studio</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <script src="/script.js"></script>
</body>
</html>
